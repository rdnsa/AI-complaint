<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#161617" />
    <meta name="color-scheme" content="light dark" />

    <!-- Inter stands in for SF Pro on platforms that do not ship it (design.md). Linked here, not
         @imported from the CSS: the browser starts the font early instead of after the stylesheet. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap"
    />

    <title>Kato Report — UPI Kampus Tasikmalaya</title>
    <meta
      name="description"
      content="Laporkan kondisi kebersihan dan fasilitas kampus (lantai, halaman, selokan, ruang kelas, toilet) cukup dengan memindai QR di lokasi. Tanpa login, laporan langsung sampai ke petugas kebersihan; AI merapikan keluhan dan menentukan prioritasnya, dan penyelesaian dibuktikan dengan foto."
    />
    <meta name="application-name" content="Kato Report" />
    <meta name="author" content="UPI Kampus Tasikmalaya" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Icons and install: SVG for modern tabs, PNG for everything that cannot read SVG. -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Kato" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Link previews (WhatsApp, Telegram, Facebook, X). Crawlers need absolute URLs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kato Report" />
    <meta property="og:title" content="Kato Report — UPI Kampus Tasikmalaya" />
    <meta
      property="og:description"
      content="Pindai QR di lokasi, tulis keluhan, kirim. Langsung sampai ke petugas kebersihan — tanpa login."
    />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og-image.png?v=3" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Kato Report, UPI Kampus Tasikmalaya: contoh keluhan kebersihan halaman gedung yang selesai dengan foto diverifikasi AI" />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kato Report — UPI Kampus Tasikmalaya" />
    <meta
      name="twitter:description"
      content="Pindai QR di lokasi, tulis keluhan, kirim. Langsung sampai ke petugas kebersihan — tanpa login."
    />
    <meta name="twitter:image" content="%SITE_URL%/og-image.png?v=3" />
    <script>
      // Dark is the default; light only when chosen with the toggle (see lib/theme.tsx).
      // Set before the first paint, so the page never flashes white.
      var light = false;
      try {
        light = localStorage.getItem('theme') === 'light';
      } catch (e) {}
      if (!light) document.documentElement.classList.add('dark');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
