<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4A1D16" />
    <meta name="color-scheme" content="light dark" />

    <title>Lapor WC Kampus — UPI Kampus Tasikmalaya</title>
    <meta
      name="description"
      content="Laporkan toilet kampus yang kotor atau rusak cukup dengan memindai QR di pintu. Tanpa login, laporan langsung sampai ke petugas kebersihan; AI merapikan keluhan dan menentukan prioritasnya."
    />
    <meta name="application-name" content="Lapor WC Kampus" />
    <meta name="author" content="UPI Kampus Tasikmalaya" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Icons and install: SVG for modern tabs, PNG for everything that cannot read SVG. -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Lapor WC" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Link previews (WhatsApp, Telegram, Facebook, X). Crawlers need absolute URLs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lapor WC Kampus" />
    <meta property="og:title" content="Lapor Kondisi Toilet — UPI Kampus Tasikmalaya" />
    <meta
      property="og:description"
      content="Pindai QR di pintu, tulis keluhan, kirim. Langsung sampai ke petugas kebersihan — tanpa login."
    />
    <meta property="og:url" content="https://ai-complaint.yvrtz.workers.dev/" />
    <meta property="og:image" content="https://ai-complaint.yvrtz.workers.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Lambang UPI dan tulisan Lapor Kondisi Toilet, UPI Kampus Tasikmalaya" />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lapor Kondisi Toilet — UPI Kampus Tasikmalaya" />
    <meta
      name="twitter:description"
      content="Pindai QR di pintu, tulis keluhan, kirim. Langsung sampai ke petugas kebersihan — tanpa login."
    />
    <meta name="twitter:image" content="https://ai-complaint.yvrtz.workers.dev/og-image.png" />
    <script>
      // Light is the default; dark only when chosen with the toggle (see lib/theme.tsx).
      try {
        if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
